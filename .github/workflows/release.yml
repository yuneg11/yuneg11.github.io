# Pushing a tag vYYMMDD (e.g. v261105) builds the CV and publishes it as a
# GitHub Release with cv-YYMMDD.pdf attached.
name: Release CV

on:
  push:
    tags: ['v[0-9][0-9][0-9][0-9][0-9][0-9]']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: wtfjoke/setup-tectonic@v4
      - name: Cache Tectonic bundle
        uses: actions/cache@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ hashFiles('cv/latex.ts') }}
          restore-keys: tectonic-
      - run: bun install --frozen-lockfile
      - run: bun run cv
      - name: Name the PDF and the release
        id: meta
        run: |
          stamp="${GITHUB_REF_NAME#v}"
          cp web/public/cv.pdf "cv-${stamp}.pdf"
          echo "stamp=${stamp}" >> "$GITHUB_OUTPUT"
          echo "date=20${stamp:0:2}-${stamp:2:2}-${stamp:4:2}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: Curriculum Vitae updated on ${{ steps.meta.outputs.date }}
          files: cv-${{ steps.meta.outputs.stamp }}.pdf
