# =============================================================================
# Single source of truth for the website (yuneg11.github.io) and the CV (LaTeX).
#
# Conventions
# -----------
# Localized value  : either ONE shared value, or BOTH languages — never mixed.
#                      unit = "AI Lab"              (same in every language)
#                      title.en = "AI Researcher"
#                      title.ko = "AI 연구원"
#                    An empty string means "nothing to show in that language".
# Names            : a name is a string, or a { given, family } table when the
#                    parts are needed separately (CV header, Open Graph):
#                      name.en = { given = "EungGu", family = "Yun" }
#                    Renderers join the parts per locale: "EungGu Yun", "윤응구".
# References       : "<kind>:<id>" strings, resolved anywhere they appear.
#                      "org:krafton"         -> [orgs.krafton]
#                      "person:juho-lee"     -> [people.juho-lee]
#                      "pub:fast-ensembling" -> the publication with that id
#                      "place:seoul"         -> [places.seoul]
#                      "person:me"           -> [personal]
#                    A string that does not match this pattern is plain text,
#                    so authors may mix references and plain names.
# Text             : plain text, plus two Markdown link forms (nothing else):
#                      <person:juho-lee>                 -> the target's name, linked
#                      [loss landscapes](pub:fast-ensembling)  -> custom link text
#                    Link targets are references or plain https URLs. Renderers
#                    resolve the url for the current language and style links.
#                    <person:x> includes the honorific ("Prof. Juho Lee",
#                    "이주호 교수"); <pub:x> shows the publication title.
#                    In multi-line strings a blank line starts a new paragraph;
#                    end other lines with "\" so they join with a space.
#                    No output-specific markup: renderers escape characters
#                    themselves (e.g. "~", "%", "#" for LaTeX).
# Entries          : experiences / education / projects / awards share one shape:
#                      title, url, org, unit, location, date | start, end, details
#                    (all optional except title). url links the title.
#                    location falls back to the org's location, so it is
#                    written only when it differs.
# Details          : [[<section>.details]] sub-tables with text.en / text.ko.
#                    Sub-tables must come AFTER all scalar fields of the parent.
# Authors          : authors lists people in order (references or plain names);
#                    equal repeats the equal-contribution entries verbatim.
#                    Renderers bold "person:me", add the "*" marks and the
#                    "*: Equal contribution" note.
# Dates            : date / start / end are tables:
#                      { year = 2023, month = 3 }       month precision
#                      { year = 2019, term = "spring" } semester ("spring" / "fall")
#                    The keys present decide the meaning:
#                      date          a single point in time
#                      start + end   a period
#                      start only    ongoing ("Present" / "현재"); the current
#                                    job title comes from this experience
#                    Renderers format per locale ("Mar 2023", "2023. 03",
#                    "2019 Spring", "2019년 1학기"). Publication and service years
#                    stay plain integers.
# Order            : entries are written in display order (newest first) and
#                    renderers keep it. Year lists (services.years) are written
#                    newest first; a renderer may sort them for its output (the
#                    CV lists them in ascending order).
# Visibility       : cv = false / web = false on any table (entry or detail)
#                    hides it from that output only (default true). Used e.g.
#                    to keep the CV within its page layout.
#
# Renderer-owned
# --------------
# Not stored here: section headings and UI labels ("Reviewer for", "Present",
# "*: Equal contribution", publication type labels), the URLs built from the
# handles in [personal], and the formats below.
#   Places         : entries "Seoul, Korea" / "서울",
#                    header  "Seoul, Korea" / "대한민국 서울".
#   Author lists   : always the English name, in every language.
#   Person in text : honorific placed by locale ("Prof. Juho Lee", "이주호 교수").
#
# Validation
# ----------
#   ids match [a-z0-9-]+; publication ids are unique; every reference resolves;
#   every "equal" entry appears in "authors" (and "equal" has 2+ entries);
#   date excludes start / end; end needs start and is not before it;
#   month is 1-12; term is "spring" | "fall";
#   type is "conference" | "workshop" | "journal" | "preprint".
# =============================================================================

